<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checador de Asistencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #57bdce;
      --secondary: #6d8da5;
      --bg-light: #f2f6f7;
      --bg-accent: #e0f6ff;
      --accent: #a8d1dd;
      --text: #2c3e50;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg-light);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      background: var(--white);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 1.8rem;
      color: var(--secondary);
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #6c757d;
      font-size: 0.95rem;
      margin-bottom: 1.8rem;
    }

    label {
      display: block;
      text-align: left;
      font-weight: 500;
      margin-bottom: 0.4rem;
      color: var(--secondary);
    }

    input[type="text"] {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 2px solid var(--accent);
      border-radius: 12px;
      font-size: 1rem;
      background: var(--bg-accent);
      margin-bottom: 1.5rem;
      outline: none;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .video-wrapper {
      width: 100%;
      max-width: 480px;
      margin: 0 auto 1.2rem;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }

    video {
      width: 100%;
      display: block;
      background: #000;
    }

    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1.2rem;
    }

    button {
      flex: 1;
      max-width: 200px;
      padding: 0.9rem 0.8rem;
      font-size: 1.05rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s;
      color: white;
    }

    button:active {
      transform: scale(0.97);
    }

    #btnEntrada {
      background-color: var(--primary);
    }

    #btnSalida {
      background-color: #e74c3c;
    }

    #status {
      font-size: 0.95rem;
      min-height: 1.5rem;
      padding: 0 0.5rem;
    }

    .error { color: #e74c3c; }
    .success { color: #27ae60; }

    @media (max-width: 480px) {
      .container {
        padding: 1.5rem 1rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .buttons {
        flex-direction: column;
        gap: 0.8rem;
      }
      button {
        max-width: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Registro de Asistencia</h1>
    <p class="subtitle">Graba un video de 3 segundos para validar tu ubicación</p>

    <label for="name">Tu nombre completo</label>
    <input type="text" id="name" placeholder="Ej. Juan Pérez" required>

    <div class="video-wrapper">
      <video id="preview" autoplay muted playsinline></video>
    </div>

    <div class="buttons">
      <button id="btnEntrada">🔵 Entrada</button>
      <button id="btnSalida">🔴 Salida</button>
    </div>

    <p id="status"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
