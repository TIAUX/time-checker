<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --primary: #57bdce;
      --secondary: #6d8da5;
      --bg-light: #f2f6f7;
      --bg-accent: #e0f6ff;
      --accent: #a8d1dd;
      --text: #2c3e50;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg-light);
      color: var(--text);
      padding: 1rem;
      min-height: 100vh;
    }

    h1 {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      color: var(--secondary);
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 1.8rem;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
      margin-bottom: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th, td {
      padding: 0.9rem 0.8rem;
      text-align: left;
      border-bottom: 1px solid var(--accent);
    }

    th {
      background-color: var(--bg-accent);
      font-weight: 600;
      color: var(--secondary);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      font-size: 0.9rem;
    }

    video {
    width: 150px;
    height: auto;
    border-radius: 8px;
    background: #000;
    }

    .entrada {
      color: var(--primary);
      font-weight: 700;
    }
    .salida {
      color: #e74c3c;
      font-weight: 700;
    }

    button.show-map {
      background-color: var(--primary);
      border: none;
      color: white;
      padding: 0.45rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    button.show-map:hover {
      background-color: var(--secondary);
    }

    #map {
      height: 300px;
      width: 100%;
      border-radius: 16px;
      margin-top: 1rem;
      display: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    /* Ajuste para móviles */
    @media (max-width: 600px) {
        h1 {
            font-size: 1.4rem;
        }
        .table-container {
            border-radius: 12px;
            /* Aseguramos un scroll horizontal generoso */
            overflow-x: auto;
        }
        th, td {
            padding: 0.6rem 0.5rem;
            font-size: 0.8rem;
        }
        video {
            width: 120px;   /* antes era 80px */
            min-width: 100px;
        }
        button.show-map {
            padding: 0.4rem 0.6rem;
            font-size: 0.8rem;
        }
    }
  </style>
</head>
<body>
  <h1>Panel de Administración</h1>
  <div class="table-container">
    <table id="submissionsTable">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Video</th>
          <th>Lat.</th>
          <th>Lon.</th>
          <th>Hora servidor</th>
          <th>Tipo</th>
          <th>Mapa</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const tableBody = document.querySelector('#submissionsTable tbody');
    const mapDiv = document.getElementById('map');
    let map = null;
    let marker = null;

    async function cargarEnvíos() {
      try {
        const res = await fetch('/api/submissions');
        if (res.status === 401) {
          tableBody.innerHTML = '<tr><td colspan="7">Acceso no autorizado. Recarga para iniciar sesión.</td></tr>';
          return;
        }
        const submissions = await res.json();
        tableBody.innerHTML = '';

        submissions.forEach(sub => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${sub.name}</td>
            <td><video controls src="/uploads/${sub.video_filename}"></video></td>
            <td>${sub.latitude.toFixed(5)}</td>
            <td>${sub.longitude.toFixed(5)}</td>
            <td>${new Date(sub.server_time).toLocaleString()}</td>
            <td class="${sub.type}">${sub.type.toUpperCase()}</td>
            <td><button class="show-map" data-lat="${sub.latitude}" data-lng="${sub.longitude}">📍 Ver</button></td>
          `;
          const btn = row.querySelector('button.show-map');
          btn.addEventListener('click', () => mostrarMapa(sub.latitude, sub.longitude));
          tableBody.appendChild(row);
        });
      } catch (err) {
        console.error(err);
      }
    }

    function mostrarMapa(lat, lng) {
      mapDiv.style.display = 'block';
      if (!map) {
        map = L.map('map').setView([lat, lng], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap'
        }).addTo(map);
      } else {
        map.setView([lat, lng], 15);
      }
      if (marker) map.removeLayer(marker);
      marker = L.marker([lat, lng]).addTo(map);
      map.invalidateSize();
    }

    cargarEnvíos();
  </script>
</body>
</html>
