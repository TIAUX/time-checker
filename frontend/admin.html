<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    video { width: 200px; }
    #map { height: 300px; margin-top: 1rem; display: none; }
    .entrada { color: blue; font-weight: bold; }
    .salida  { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Panel de Administración</h1>
  <table id="submissionsTable">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Video</th>
        <th>Latitud</th>
        <th>Longitud</th>
        <th>Hora del servidor</th>
        <th>Tipo</th>
        <th>Ver en mapa</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const tableBody = document.querySelector('#submissionsTable tbody');
    const mapDiv = document.getElementById('map');
    let map = null;
    let marker = null;

    async function cargarEnvíos() {
      try {
        // El navegador enviará automáticamente las credenciales de Basic Auth
        const res = await fetch('/api/submissions', {
          // Si no se usa sesión, incluir credenciales
          // credentials: 'include' // no necesario con Basic Auth ya que va en el header
        });
        if (res.status === 401) {
          tableBody.innerHTML = '<tr><td colspan="7">Acceso no autorizado. Recarga la página para iniciar sesión.</td></tr>';
          return;
        }
        const submissions = await res.json();
        tableBody.innerHTML = '';

        submissions.forEach(sub => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${sub.name}</td>
            <td>
              <video controls src="/uploads/${sub.video_filename}" width="200"></video>
            </td>
            <td>${sub.latitude}</td>
            <td>${sub.longitude}</td>
            <td>${new Date(sub.server_time).toLocaleString()}</td>
            <td class="${sub.type}">${sub.type.toUpperCase()}</td>
            <td><button data-lat="${sub.latitude}" data-lng="${sub.longitude}">Mostrar</button></td>
          `;
          const btn = row.querySelector('button');
          btn.addEventListener('click', () => mostrarMapa(sub.latitude, sub.longitude));
          tableBody.appendChild(row);
        });
      } catch (err) {
        console.error(err);
      }
    }

    function mostrarMapa(lat, lng) {
      if (!map) {
        map = L.map('map').setView([lat, lng], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '© OpenStreetMap'
        }).addTo(map);
      }
      if (marker) map.removeLayer(marker);
      marker = L.marker([lat, lng]).addTo(map);
      map.setView([lat, lng], 15);
      mapDiv.style.display = 'block';
    }

    cargarEnvíos();
  </script>
</body>
</html>
